; PlatformIO Project Configuration File
;
; Two applications share this repository:
;
;   [env:esp32-s3-devkitc-1]  robot firmware  (src/main.cpp)
;   [env:pid-gather]          sysid / PID data gathering tool
;                             (src/apps/pid_gather/main.cpp)
;
; The two envs compile the same hal/control/sensors/comms modules; only the
; application entry point (setup/loop) differs, selected by build_src_filter.
; That keeps the motor/encoder/mixer conventions identical between them.
;
; Build:   pio run                      (robot firmware, the default env)
;          pio run -e pid-gather        (sysid tool)
; Upload:  pio run -t upload
;          pio run -e pid-gather -t upload
; Monitor: pio device monitor
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

; -----------------------------------------------------------------------------
; Shared target settings. Change `board` here to retarget both applications.
; -----------------------------------------------------------------------------
[esps3_base]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; Decode ESP32 backtraces instead of printing raw addresses.
monitor_filters = esp32_exception_decoder

; -----------------------------------------------------------------------------
; Robot firmware
; -----------------------------------------------------------------------------
[env:esp32-s3-devkitc-1]
extends = esps3_base
; Exactly one app owns setup()/loop(): the robot's src/main.cpp.
build_src_filter = +<*> -<apps/>

; Serial goes over the native USB-CDC port instead of UART0.
; GPIO43/44 are the default UART0 TX/RX pins, but this robot uses them for
; the left-back motor driver (ENA_LB/ENB_LB), so UART0 must not be used.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; Both libraries are vendored under lib/ so the project builds without
; network access. If you prefer the registry versions, delete lib/Madgwick
; and lib/RF24 and uncomment (verify the exact names on
; https://registry.platformio.org first):
; lib_deps =
;     arduino-libraries/Madgwick@^1.2.0
;     nrf24/RF24@^1.6.2

; -----------------------------------------------------------------------------
; Sysid / PID data gathering tool.
;
; Run parameters default to include/app/pid_gather_config.h (PRBS / VY /
; open loop). Override them per run without touching source:
;
;   $env:PLATFORMIO_BUILD_FLAGS = "-DPID_GATHER_MODE=1 -DPID_GATHER_AXIS=0"
;   pio run -e pid-gather -t upload
;   Remove-Item Env:PLATFORMIO_BUILD_FLAGS
;
; PID_GATHER_MODE: 0=STEP 1=CHIRP 2=PRBS 3=RAMP
; PID_GATHER_AXIS: 0=VX   1=VY    2=OMEGA
; PID_GATHER_USE_PID: 0=open loop (sysid), 1=closed loop (validation)
;
; The parameters stay out of this file's build_flags on purpose: PlatformIO
; appends the env var, so repeating them here would produce -D redefinition
; warnings.
; -----------------------------------------------------------------------------
[env:pid-gather]
extends = esps3_base
build_src_filter = +<*> -<main.cpp>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
