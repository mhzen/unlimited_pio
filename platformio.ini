; PlatformIO Project Configuration File
;
; Forklift Robot - ESP32-S3 mecanum/X-drive controller
; Ported from the Arduino IDE sketch at
;   ../Forklift Robot/legacy/legacy.ino
;
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Decode ESP32 backtraces instead of printing raw addresses.
monitor_filters = esp32_exception_decoder

; Serial goes over the native USB-CDC port instead of UART0.
; GPIO43/44 are the default UART0 TX/RX pins, but this robot uses them for
; the left-back motor driver (ENA_LB/ENB_LB), so UART0 must not be used.
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; Both libraries are vendored under lib/ so the project builds without
; network access. If you prefer the registry versions, delete lib/Madgwick
; and lib/RF24 and uncomment (verify the exact names on
; https://registry.platformio.org first):
; lib_deps =
;     arduino-libraries/Madgwick@^1.2.0
;     nrf24/RF24@^1.6.2

; ---------------------------------------------------------------------------
; Alternative targets (uncomment one and update [platformio] default_envs).
; Pin mapping assumes an ESP32-S3-WROOM-1 style module with GPIO 1-48.
; ---------------------------------------------------------------------------
; [env:esp32-s3-devkitm-1]
; platform = espressif32
; board = esp32-s3-devkitm-1
; framework = arduino
; monitor_speed = 115200
; upload_speed = 460800
; build_flags =
;     -DARDUINO_USB_CDC_ON_BOOT=1
